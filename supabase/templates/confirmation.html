<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verify your email</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7f8;
        color: #111827;
        margin: 0;
        padding: 32px 16px;
      }
      .card {
        max-width: 520px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 24px;
      }
      .code {
        display: inline-block;
        margin: 16px 0;
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid #d1d5db;
        background: #f9fafb;
        font-size: 22px;
        letter-spacing: 0.1em;
        font-weight: 600;
      }
      .button {
        display: inline-block;
        background: #111827;
        color: #ffffff !important;
        text-decoration: none;
        padding: 12px 18px;
        border-radius: 8px;
        font-weight: 600;
      }
      .muted {
        color: #6b7280;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Verify your email</h2>
      <p>Enter this code in the app to verify your account:</p>
      <div class="code">{{ .Token }}</div>
      <p>Or use the button below to continue:</p>
      <p>
        <a class="button" href="{{ .ConfirmationURL }}">Verify email</a>
      </p>
      <p class="muted">
        If you did not create this account, you can ignore this email.
      </p>
    </div>
  </body>
</html>
