<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your password</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7f8;
        color: #111827;
        margin: 0;
        padding: 32px 16px;
      }
      .card {
        max-width: 520px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 24px;
      }
      .button {
        display: inline-block;
        background: #111827;
        color: #ffffff !important;
        text-decoration: none;
        padding: 12px 18px;
        border-radius: 8px;
        font-weight: 600;
      }
      .muted {
        color: #6b7280;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Reset your password</h2>
      <p>Click the button below to choose a new password for your account.</p>
      <p>
        <a class="button" href="{{ .ConfirmationURL }}">Reset password</a>
      </p>
      <p class="muted">
        If you didn’t request this, you can safely ignore this email.
      </p>
    </div>
  </body>
</html>
