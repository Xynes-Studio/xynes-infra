# Generated from xynes-infra scripts/setup/ci-quality-profiles.json.
name: "Required quality gates"
"on":
  pull_request:
    branches:
      - "main"
      - "develop"
      - "release/*"
  push:
    branches:
      - "main"
      - "develop"
      - "release/*"
  workflow_dispatch: {}
permissions:
  contents: "read"
concurrency:
  group: "quality-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  gates:
    name: "${{ matrix.gate }}"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        gate:
          - "lint"
          - "test"
          - "coverage"
          - "build"
          - "typecheck"
    env:
      GATE_NAME: "${{ matrix.gate }}"
    steps:
      -
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        with:
          persist-credentials: false
      -
        uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6"
        with:
          bun-version: "1.4.2"
      -
        uses: "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020"
        with:
          node-version: "22.22.0"
      -
        uses: "pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1"
        with:
          version: "10.33.0"
        if: "matrix.gate == 'typecheck'"
      -
        run: "pnpm install --frozen-lockfile --ignore-scripts"
        working-directory: ".github/type-tools"
        if: "matrix.gate == 'typecheck'"
      -
        run: |
          set -euo pipefail
          age_dir="${RUNNER_TEMP:?}/age-tools"
          mkdir -p "$age_dir"
          chmod 700 "$age_dir"
          curl --fail --silent --show-error --location https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz --output "$age_dir/age.tar.gz"
          printf '%s  %s\n' cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10 "$age_dir/age.tar.gz" | sha256sum -c -
          tar -xzf "$age_dir/age.tar.gz" --strip-components=1 -C "$age_dir" age/age age/age-keygen
          printf 'XYNES_TEST_AGE_BIN=%s\n' "$age_dir" >> "${GITHUB_ENV:?}"
        name: "Install independently verified age fixture binaries"
        if: "matrix.gate == 'test'"
      -
        run: |
          set -euo pipefail
          apex_dir="${RUNNER_TEMP:?}/apex-go-tools"
          mkdir "$apex_dir"
          chmod 700 "$apex_dir"
          curl --fail --silent --show-error --location https://go.dev/dl/go1.27.2.linux-amd64.tar.gz --output "$apex_dir/go.tar.gz"
          printf '%s  %s\n' ecbadb99091a3f46e31f5f934b068b1864eafa7995211b39eaddf76996045fe5 "$apex_dir/go.tar.gz" | sha256sum -c -
          tar -xzf "$apex_dir/go.tar.gz" -C "$apex_dir"
          mkdir "$apex_dir/cache"
          GOROOT="$apex_dir/go" GOTOOLCHAIN=local "$apex_dir/go/bin/go" version | grep -qx 'go version go1.27.2 linux/amd64'
          fixture='node:22.23.1-alpine3.23@sha256:4848379985144e72c7537574c1a894d4ec096704b21ce45e5eee386be9fab737'
          docker pull --platform linux/amd64 "$fixture"
          [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$fixture")" == linux/amd64 ]]
          postgres_fixture='postgres:17-alpine@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca'
          docker pull --platform linux/amd64 "$postgres_fixture"
          [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$postgres_fixture")" == linux/amd64 ]]
          postgres_auth_fixture='postgres:17-alpine@sha256:5a6fcbc5d93831991d2386fa634509b3c49a1ac5ffb70c13c2322840f821d7e7'
          docker pull --platform linux/amd64 "$postgres_auth_fixture"
          [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$postgres_auth_fixture")" == linux/amd64 ]]
          auth_fixture='supabase/gotrue:v2.196.0@sha256:7e813221b93fbf54b515036438550e483bfaf057b9db52fe9bc1ce91c47e817e'
          docker pull --platform linux/amd64 "$auth_fixture"
          [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$auth_fixture")" == linux/amd64 ]]
          printf 'GOROOT=%s\nGOCACHE=%s\nGOTOOLCHAIN=local\nXYNES_GO_BIN=%s\nXYNES_IDLE_FIXTURE_IMAGE=%s\n' "$apex_dir/go" "$apex_dir/cache" "$apex_dir/go/bin/go" "$fixture" >> "${GITHUB_ENV:?}"
        name: "Prepare verified Apex Go and public Linux fixture"
        if: "matrix.gate == 'test'"
      -
        run: |
          case "$GATE_NAME" in
            lint)
              bun scripts/lib/apex-ci-policy.ts
              python3 -c "import ast,pathlib,subprocess; [subprocess.run(['bash','-n',str(p)],check=True) for p in pathlib.Path('scripts').rglob('*.sh')]; [ast.parse(p.read_text()) for p in pathlib.Path('scripts').rglob('*.py')]"
              ;;
            test)
              bun test scripts/test/ci-policy.test.ts scripts/test/ci-coverage.test.ts scripts/test/ci-release-gates.test.ts scripts/test/source-checks.test.ts scripts/test/apex-ci-policy.test.ts
              bash scripts/test/branch-protection-script.test.sh
              bash scripts/test/vps-deploy-users-boundary.test.sh
              python3 scripts/test/branch-protection-security.test.py
              bash scripts/test/env-templates-no-secrets.test.sh
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/env-secret-diagnostics.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/public-bundle.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/secret-gate.test.py
              bash scripts/test/cms-content-delivery-prerequisites.test.sh
              python3 scripts/test/backup_recovery_test.py
              bash scripts/test/cms-delivery-contract-parity-safety.test.sh
              bash scripts/test/cms-content-integrations-safety.test.sh
              bash scripts/test/feature-flags-live-guard.test.sh
              bash scripts/test/domain-constraint-env-guard.test.sh
              bash scripts/test/source-context.test.sh
              bash scripts/test/release-manifest.test.sh
              bash scripts/test/migration-inventory.test.sh
              bash scripts/test/migration-plan.test.sh
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/migration-sql.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/migration-sql-runtime.test.py
              bash scripts/test/image-build.test.sh
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/libreoffice-recipe.test.py
              bash scripts/test/registry-io.test.sh
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/registry-https.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/registry-policy.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/admission.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/publish-batch.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/registry-namespace.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/github-read.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/provider-inputs.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/environment-inputs.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/auth-runtime.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/auth-runtime.integration.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/artifact-handoff.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/artifact-download.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/publish-images.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/publication-record.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/attestation-binding.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/native-attestation.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/deploy-request.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/deployment-candidate.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/ssh-entry.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/deploy-admission.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/deploy-dispatch.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/host-release-state.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/host-compose.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/migration-transport.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/pg-container-bridge.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/candidate-migration.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/host-migrate.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/host-seed.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/host-backup.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/host-backup-schedule.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/host-idle.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/apex-ingress.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/host-assets.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/host-controls.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/host-storage-control.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/host-quiescence.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/host-smoke.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/host-smoke-setup.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/host-runtime.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/host-supervisor.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/root-executor.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/host-boundary.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/host-retained-dev.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/build-pipeline.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/apex-workflow.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/ci-smoke.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/ci-smoke-runtime.test.py
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/ci-smoke-stack.test.py
              bash scripts/test/hosted-release.test.sh
              bash scripts/test/processor-readiness.test.sh
              bash scripts/test/vps-reconcile.test.sh
              bash scripts/test/staging-substrate.test.sh
              PYTHONDONTWRITEBYTECODE=1 python3 scripts/test/ci-apex-quality.test.py
              (cd infra/idle/adapter && "${XYNES_GO_BIN:?Pinned Go required}" test -race -count=1 ./... && "$XYNES_GO_BIN" vet ./...)
              bash scripts/test/idle-adapter-unix.test.sh --runtime
              bash scripts/test/idle-adapter-host.test.sh --runtime
              ;;
            coverage)
              bun .github/ci/coverage-gate.ts --policy
              ;;
            build)
              bash scripts/setup/configure-branch-protection.sh --dry-run
              ;;
            typecheck)
              .github/type-tools/node_modules/.bin/tsc --strict --noEmit --target ES2022 --module ESNext --moduleResolution bundler --types node --typeRoots .github/type-tools/node_modules/@types scripts/lib/ci-policy.ts scripts/lib/apex-ci-policy.ts scripts/lib/ci-coverage.ts scripts/lib/ci-release-gates.ts scripts/release/source_checks.ts
              ;;
            *) exit 2 ;;
          esac
