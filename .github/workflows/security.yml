name: CI security policy

on:
  pull_request:
    branches: [main, develop, "release/*"]
  push:
    branches: [main, develop, "release/*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # verified upstream v2
        with:
          bun-version: 1.4.2
      - name: Enforce immutable workflow dependencies and trust boundaries
        run: bun scripts/lib/apex-ci-policy.ts
      - name: Install checksum-verified secret scanner
        run: |
          set -euo pipefail
          umask 077
          scanner_dir="${RUNNER_TEMP:?}/apex-gitleaks"
          mkdir "$scanner_dir"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$scanner_dir/scanner.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$scanner_dir/scanner.tar.gz" | sha256sum -c -
          tar -xzf "$scanner_dir/scanner.tar.gz" -C "$scanner_dir" gitleaks
          [[ "$("$scanner_dir/gitleaks" version)" == 8.30.1 ]]
      - name: Block unreviewed secrets across all fetched history
        run: python3 scripts/security/secret_gate.py --repo "${GITHUB_WORKSPACE:?}" --scanner "${RUNNER_TEMP:?}/apex-gitleaks/gitleaks" --exceptions .github/secret-scan-exceptions.json
